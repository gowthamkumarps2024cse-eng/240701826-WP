<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart AI Hospital Guide</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;min-height:100vh;color:white;overflow-x:hidden;background:#0c4a6e}
.hospital-bg{position:fixed;inset:0;z-index:-3;background-color:#0c4a6e;background-image:url("hospital1.jpg");background-size:cover;background-position:center;animation:hospitalMove 15s ease-in-out infinite alternate}
@keyframes hospitalMove{0%{transform:scale(1);background-position:center}100%{transform:scale(1.08);background-position:center top}}
.hospital-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.58);z-index:-2}
.bg-slides{position:fixed;inset:0;z-index:-3;overflow:hidden}
.bg-slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;animation:slideShow 28s linear infinite}
@keyframes slideShow{0%{opacity:0;transform:scale(1)}6%{opacity:1}25%{opacity:1}31%{opacity:0;transform:scale(1.12)}100%{opacity:0;transform:scale(1.12)}}
@media(prefers-reduced-motion:reduce){.bg-slide{animation:none}.bg-slide:first-child{opacity:1}}
.college-logo{width:120px;height:120px;object-fit:contain;display:block;margin:0 auto 8px;border-radius:50%;background:#fff}

.page{display:none;min-height:100vh;padding:25px}
.page.active{display:block}
.card{width:100%;max-width:1100px;margin:20px auto;background:rgba(255,255,255,0.96);color:#222;padding:25px;border-radius:20px;box-shadow:0 10px 35px rgba(0,0,0,0.30)}
h1{text-align:center;margin-bottom:10px}
h2{margin-bottom:15px;color:#075985}
h3{margin-bottom:10px;color:#075985}
.subtitle{text-align:center;margin-bottom:20px}
.language-card{max-width:600px;margin:60px auto;text-align:center}
.vanakkam{font-size:64px;line-height:1}
.vanakkam-img{width:150px;height:150px;border-radius:50%;display:block;margin:0 auto 6px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.vanakkam-text{font-size:44px;color:#c2410c;margin:6px 0 0}
.vanakkam-sub{font-size:18px;color:#075985;letter-spacing:2px;margin-bottom:14px}
.language-buttons{display:flex;flex-direction:column;gap:15px;margin-top:25px}
.language-buttons button{padding:16px;font-size:20px}
.speak-btn{margin-top:18px;background:#475569}
.login-container{display:flex;justify-content:center;align-items:center;width:100%;min-height:55vh;padding:20px}
.login-card{width:100%;max-width:520px;margin:0 auto;background:rgba(255,255,255,0.96);color:#222;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
.form-group{margin-bottom:15px}
label{display:block;margin-bottom:6px;font-weight:bold}
input,select,textarea{width:100%;padding:12px;border:1px solid #bbb;border-radius:8px;font-size:15px;background:white;color:#222}
input[readonly]{background:#f1f5f9}
input[type=radio]{width:auto;margin-right:6px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #0284c7}
button{border:none;border-radius:8px;padding:12px 18px;cursor:pointer;font-weight:bold;font-size:14px;background:#0284c7;color:white}
button:hover{opacity:0.9}
button:disabled{opacity:.5;cursor:not-allowed}
.btn-green{background:#16a34a}.btn-red{background:#dc2626}.btn-orange{background:#ea580c}.btn-purple{background:#7c3aed}.btn-gray{background:#475569}.btn-dark{background:#1e293b}
.top-bar{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:15px}
.top-bar.menu-pad{padding-right:64px}
.top-title{font-size:22px;font-weight:bold}
.top-actions{display:flex;gap:10px;flex-wrap:wrap}
.back-row{max-width:1200px;margin:0 auto 12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.full{grid-column:1/-1}
.info-box{background:#e0f2fe;border-left:5px solid #0284c7;padding:12px;margin:10px 0 18px;color:#0c4a6e;border-radius:7px}
.patient-row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px;margin-bottom:15px;background:white;color:#222;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,0.15)}
.patient-info{flex:1;line-height:1.8}
.patient-info strong{font-size:20px;color:#075985}
.patient-actions{text-align:right;min-width:200px}
.delete-btn{background:#dc2626;margin:4px}
.empty-box{background:white;color:#333;padding:24px;text-align:center;border-radius:15px;border:1px dashed #cbd5e1}
.dashboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.detail-box{background:#f8fafc;padding:18px;border-radius:12px;border:1px solid #ddd;line-height:1.8}
.detail-box strong{color:#075985}
.bottom-navigation{max-width:1000px;margin:30px auto 10px;background:rgba(0,0,0,0.75);padding:15px;border-radius:15px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
#messageBox{position:fixed;top:20px;right:20px;z-index:1000;display:none;padding:15px 20px;border-radius:10px;background:#16a34a;color:white;font-weight:bold;box-shadow:0 5px 20px rgba(0,0,0,0.3);max-width:350px}
#messageBox.error{background:#dc2626}
.role-menu-wrap{position:fixed;top:18px;right:22px;z-index:900}
.role-menu-btn{width:46px;height:46px;border-radius:50%;padding:0;background:rgba(255,255,255,.96);color:#222;font-size:27px;line-height:42px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.role-menu{display:none;position:absolute;top:54px;right:0;width:245px;background:rgba(255,255,255,.98);color:#222;border-radius:14px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.role-menu.show{display:block}
.role-menu button{display:block;width:100%;margin:6px 0;text-align:left;background:#f1f5f9;color:#222;border-radius:9px}
.role-menu button:hover{background:#e0f2fe}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:900px;margin:30px auto}
.menu-card{border-radius:20px;padding:34px 24px;text-align:center;cursor:pointer;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.95);color:#222;box-shadow:0 12px 35px rgba(0,0,0,.20);transition:.2s ease}
.menu-card:hover{transform:translateY(-5px)}
.menu-icon{font-size:58px;margin-bottom:10px}
.menu-card h2{margin:8px 0}
.menu-card p{margin:6px 0 16px;opacity:.75}
.med-row{background:#f8fafc;border:1px solid #cbd5e1;border-radius:12px;padding:14px;margin-bottom:14px}
.med-title{font-weight:bold;color:#075985;margin-bottom:10px}
.radio-row{display:flex;gap:26px;padding:6px 0}
.radio-row label{font-weight:normal;margin:0}
.visit-card{background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:14px;margin:10px 0;line-height:1.7;color:#222}
.visit-card .tag{display:inline-block;background:#e0f2fe;color:#075985;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:bold}
.med-table{width:100%;border-collapse:collapse;margin:6px 0}
.med-table th,.med-table td{border:1px solid #cbd5e1;padding:6px 8px;text-align:left;font-size:14px}
.med-table th{background:#f1f5f9}
.hosp-head{background:#075985;color:#fff;border-radius:14px;padding:16px;text-align:center;margin-bottom:18px}
.hosp-head h2{color:#fff;margin-bottom:4px}
.notice{font-size:13px;opacity:.85;margin-top:8px}
#receiptSheet{background:#fff;color:#000;max-width:794px;margin:20px auto;padding:30px 36px;border-radius:8px}
.rc-head{text-align:center;border-bottom:3px double #000;padding-bottom:10px;margin-bottom:14px}
.rc-head h1{margin:0;font-size:22px;color:#000}
.rc-head h2{margin:4px 0 0;font-size:16px;color:#000}
.rc-table{width:100%;border-collapse:collapse;margin:8px 0 14px}
.rc-table th,.rc-table td{border:1px solid #444;padding:6px 8px;text-align:left;font-size:14px;vertical-align:top}
.rc-table th{background:#eee}
.rc-table.kv th{width:34%}
.rc-title{font-size:15px;font-weight:bold;margin:12px 0 4px}
.rc-foot{font-size:12px;margin-top:16px;border-top:1px solid #000;padding-top:8px}
@media(max-width:800px){
.form-grid,.dashboard-grid,.menu-grid{grid-template-columns:1fr}
.full{grid-column:auto}
.patient-row{flex-direction:column;align-items:stretch}
.patient-actions{text-align:left;min-width:auto}
.delete-btn{width:100%;margin:5px 0}
.top-bar{flex-direction:column;align-items:stretch}
.top-bar.menu-pad{padding-right:0;padding-top:52px}
.top-actions{justify-content:flex-end}
.role-menu-wrap{top:12px;right:12px}.role-menu{width:220px}
#receiptSheet{padding:18px}
}
@media print{
@page{size:A4;margin:14mm}
body{background:#fff;color:#000}
.hospital-bg,.bg-slides,.hospital-overlay,#messageBox,.no-print,.role-menu-wrap{display:none!important}
.page{display:none!important}
#receiptPage.active{display:block!important;padding:0;min-height:0}
#receiptSheet{box-shadow:none;margin:0;max-width:none;padding:0;border-radius:0}
}
</style>
</head>

    </div>

async function api(method,path,body){
  const opt={method:method,headers:{}};
  if(authToken)opt.headers.Authorization="Bearer "+authToken;
  if(body!==undefined){opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(body)}
  let res;
  try{res=await fetch("/api"+path,opt)}catch(e){throw{code:"netError"}}
  let data={};
  try{data=await res.json()}catch(e){}
  if(!res.ok)throw{code:data.error||"serverError",status:res.status};
  return data;
}

    const ss=window.speechSynthesis;
    ss.cancel();
    const u1=new SpeechSynthesisUtterance("Kindly choose your language.");u1.lang="en-IN";

}

/* ===================== VISIT HELPERS ===================== */
function latestVisit(p){
  const h=p&&Array.isArray(p.visitHistory)?p.visitHistory:[];
  if(!h.length)return null;
  let best=0;
  h.forEach(function(v,i){if((v.ts||0)>=(h[best].ts||0))best=i});
  return h[best];
}
function sortedHistory(p){
  const h=p&&Array.isArray(p.visitHistory)?p.visitHistory:[];
  return h.map(function(v,i){return{v:v,i:i}}).sort(function(a,b){return((b.v.ts||0)-(a.v.ts||0))||(b.i-a.i)}).map(function(x){return x.v});
}
function visitMeds(v){
  if(Array.isArray(v.medicines)&&v.medicines.length)return v.medicines;
  if(v.medicineText)return[{name:v.medicineText}];
  if(v.medicine)return[{name:v.medicine,dosage:v.dosage||"",frequency:v.frequency||"",duration:v.duration||""}];
  return[];
}
function medsTable(meds){
  if(!meds.length)return'<span style="color:#64748b">'+esc(t("notAvailable"))+'</span>';
  const full=meds.some(function(m){return m.dosage||m.when||m.frequency||m.duration});
  if(!full)return meds.map(function(m){return esc(m.name)}).join("<br>");
  return'<table class="med-table"><tr><th>'+esc(t("medicine"))+'</th><th>'+esc(t("dosage"))+'</th><th>'+esc(t("whenToTake"))+'</th><th>'+esc(t("frequency"))+'</th><th>'+esc(t("duration"))+'</th></tr>'+
    meds.map(function(m){return'<tr><td>'+esc(m.name)+'</td><td>'+esc(m.dosage||"-")+'</td><td>'+esc(m.when?tm(m.when):"-")+'</td><td>'+esc(m.frequency?tm(m.frequency):"-")+'</td><td>'+esc(m.duration?tm(m.duration):"-")+'</td></tr>'}).join("")+'</table>';
}
function nextInfo(v){
  if(v.nextRequired===true||(v.nextRequired===undefined&&v.nextDate))return{state:"yes"};
  if(v.nextRequired===false)return{state:"no"};
  return{state:"unknown"};
}
function nextText(v){const n=nextInfo(v);return n.state==="yes"?t("yes"):n.state==="no"?t("no"):t("notAvailable")}
function visitDateTime(v){return(fmtDate(v.date)+" "+fmtTime(v.time)).trim()}
function historyHtml(p){
  const list=sortedHistory(p);
  if(!list.length)return'<div class="empty-box">'+esc(t("noHistory"))+'</div>';
  return list.map(function(v,idx){
    const n=nextInfo(v);
    let next=esc(nextText(v));
    if(n.state==="yes"){next+=' — '+esc((fmtDate(v.nextDate)+" "+fmtTime(v.nextTime)).trim())+(v.block?' — '+esc(tm(v.block)):'')+(v.room?' / '+esc(v.room):'')}
    return'<div class="visit-card"><span class="tag">'+esc(t("visit"))+' '+(list.length-idx)+'</span> <span class="tag">'+esc(t("enteredBy"))+': '+esc(tm(v.source||"-"))+'</span><br>'+
      '<b>'+esc(t("date"))+':</b> '+esc(visitDateTime(v)||"-")+'<br>'+
      '<b>'+esc(t("doctor"))+':</b> '+esc(v.doctor||"-")+'<br>'+
      '<b>'+esc(t("healthIssue"))+':</b> '+esc(tm(v.healthIssue||"-"))+' &nbsp; <b>'+esc(t("department"))+':</b> '+esc(tm(v.department||"-"))+'<br>'+
      '<b>'+esc(t("medicines"))+':</b> '+medsTable(visitMeds(v))+
      (v.notes?'<b>'+esc(t("notes"))+':</b> '+esc(v.notes)+'<br>':'')+
      '<b>'+esc(t("nextVisit"))+':</b> '+next+'</div>';
  }).join("");
}
function regTimeText(p){
  const r=p.registeredAt||p.createdAt;if(!r)return"";
  const d=new Date(r);
  if(isNaN(d.getTime()))return String(r);
  try{return d.toLocaleString(LOCALES[lang],{dateStyle:"medium",timeStyle:"short"})}catch(e){return String(r)}
}

    '<div class="detail-box"><h3>'+esc(t("latestCheckup"))+'</h3>'+latestBlock(p)+'</div></div><br>'+
    '<h3>📖 '+esc(t("visitHistory"))+'</h3>'+historyHtml(p)+
    '<br><button type="button" class="delete-btn" onclick="doctorDeletePatient()">🗑 '+esc(t("deletePatient"))+'</button>';
  box.style.display="block";
}
function latestBlock(p){
  const v=latestVisit(p);
  if(!v)return'<p>'+esc(t("noCheckup"))+'</p>';
  return'<p><strong>'+esc(t("date"))+':</strong> '+dash(visitDateTime(v))+'</p>'+
    '<p><strong>'+esc(t("doctor"))+':</strong> '+dash(v.doctor)+'</p>'+
    '<p><strong>'+esc(t("medicines"))+':</strong></p>'+medsTable(visitMeds(v));
}
async function doctorDeletePatient(){
  if(!needDoctor()||!selMobile)return;
  if(await removePatient(selMobile)){
    selMobile="";$("patientPanel").style.display="none";$("checkupCard").style.display="none";
    $("searchMobile").value="";msg("patientDeleted");
  }
}

/* ===================== DOCTOR: CHECKUP FORM ===================== */
function newMedRow(){return{sel:"",name:"",dosage:"",when:"",freq:"",dur:""}}
function resetCheckupForm(){
  medRows=[newMedRow()];
  $("ckNotes").value="";
  document.querySelectorAll('input[name="nextReq"]').forEach(function(r){r.checked=false});
  ["ckNextDate","ckNextTime"].forEach(function(id){$(id).value=""});
  $("ckBlock").value="";loadRooms();
  toggleNext();renderMedRows();
}
function ckIssueChanged(){
  const issue=$("ckIssue").value,d=ISSUES[issue];
  const dept=$("ckDept");
  dept.dataset.v=d?d.dept:"";dept.value=d?tm(d.dept):"";
  renderMedRows();
}
function medOptions(issue){
  if(ISSUES[issue])return ISSUES[issue].meds;
  const all=[];Object.keys(ISSUES).forEach(function(k){ISSUES[k].meds.forEach(function(m){if(all.indexOf(m)<0)all.push(m)})});
  return all;
}
function doseOptions(issue){
  if(ISSUES[issue])return ISSUES[issue].doses;
  const all=[];Object.keys(ISSUES).forEach(function(k){ISSUES[k].doses.forEach(function(m){if(all.indexOf(m)<0)all.push(m)})});
  return all;
}
function addMedRow(){medRows.push(newMedRow());renderMedRows()}
function removeMedRow(i){if(medRows.length<=1)return;medRows.splice(i,1);renderMedRows()}
function medSel(i,v){medRows[i].sel=v;if(v!=="__other")medRows[i].name="";renderMedRows()}
function medSet(i,k,v){medRows[i][k]=v}
function renderMedRows(){
  const box=$("medRows");if(!box)return;
  const issue=$("ckIssue")?$("ckIssue").value:"";
  const opts=medOptions(issue);
  $("doseList").innerHTML=doseOptions(issue).map(function(d){return'<option value="'+esc(d)+'">'}).join("");
  box.innerHTML=medRows.map(function(r,i){
    let medSelect='<option value="">'+esc(t("selectMedicine"))+'</option>';
    const list=opts.slice();
    if(r.sel&&r.sel!=="__other"&&list.indexOf(r.sel)<0)list.push(r.sel);
    list.forEach(function(m){medSelect+='<option value="'+esc(m)+'"'+(r.sel===m?" selected":"")+'>'+esc(m)+'</option>'});
    medSelect+='<option value="__other"'+(r.sel==="__other"?" selected":"")+'>'+esc(t("otherMedicine"))+'</option>';
    return'<div class="med-row"><div class="med-title">'+esc(t("medicine"))+' '+(i+1)+'</div><div class="form-grid">'+
      '<div class="form-group"><label>'+esc(t("medicine"))+'</label><select onchange="medSel('+i+',this.value)">'+medSelect+'</select></div>'+
      (r.sel==="__other"?'<div class="form-group"><label>'+esc(t("medicineName"))+'</label><input type="text" value="'+esc(r.name)+'" placeholder="'+esc(t("medicineNamePh"))+'" oninput="medSet('+i+',\'name\',this.value)"></div>':'')+
      '<div class="form-group"><label>'+esc(t("dosage"))+'</label><input type="text" list="doseList" value="'+esc(r.dosage)+'" placeholder="'+esc(t("dosagePh"))+'" oninput="medSet('+i+',\'dosage\',this.value)"></div>'+
      '<div class="form-group"><label>'+esc(t("whenToTake"))+'</label><select onchange="medSet('+i+',\'when\',this.value)">'+optHtml(WHEN_OPTS,r.when,t("selectWhen"))+'</select></div>'+
      '<div class="form-group"><label>'+esc(t("frequency"))+'</label><select onchange="medSet('+i+',\'freq\',this.value)">'+optHtml(FREQ_OPTS,r.freq,t("selectWhen"))+'</select></div>'+
      '<div class="form-group"><label>'+esc(t("duration"))+'</label><select onchange="medSet('+i+',\'dur\',this.value)">'+optHtml(DUR_OPTS,r.dur,t("selectWhen"))+'</select></div>'+
      '</div>'+(medRows.length>1?'<button type="button" class="btn-red" onclick="removeMedRow('+i+')">'+esc(t("removeMedicine"))+'</button>':'')+'</div>';
  }).join("");
}
function addQuickNote(){
  const sel=$("ckNoteOption"),v=sel.value;
  if(!v)return;
  const ta=$("ckNotes"),text=tm(v);
  ta.value=ta.value.trim()?ta.value+"\n"+text:text;
  sel.value="";
}
function nextChoice(){const r=document.querySelector('input[name="nextReq"]:checked');return r?r.value:""}
function toggleNext(){
  const yes=nextChoice()==="yes";
  $("nextBox").style.display=yes?"block":"none";
  ["ckNextDate","ckNextTime","ckBlock","ckRoom"].forEach(function(id){$(id).disabled=!yes});
  if(!yes){["ckNextDate","ckNextTime"].forEach(function(id){$(id).value=""});$("ckBlock").value="";loadRooms()}
}
function loadRooms(){
  const b=$("ckBlock"),r=$("ckRoom");if(!b||!r)return;
  const cur=r.value;
  r.innerHTML=optHtml(BLOCK_ROOMS[b.value]||[],cur,t("selectRoom"));
  if(cur&&(BLOCK_ROOMS[b.value]||[]).indexOf(cur)>-1)r.value=cur;
}
async function saveCheckup(){
  if(!needDoctor())return;
  if(saving)return;
  if(!selMobile||!getPatients()[selMobile]){msg("needSearch","error");return}
  const issue=$("ckIssue").value;
  if(!issue){msg("selectCurrentIssue","error");return}
  const meds=[];
  for(let i=0;i<medRows.length;i++){
    const r=medRows[i],name=r.sel==="__other"?r.name.trim():r.sel;
    if(!name||!r.dosage.trim()||!r.when||!r.freq||!r.dur){msg("medIncomplete","error");return}
    meds.push({name:name,dosage:r.dosage.trim(),when:r.when,frequency:r.freq,duration:r.dur});
  }
  const choice=nextChoice();
  if(!choice){msg("selectNextChoice","error");return}
  const nd=$("ckNextDate").value,nt=$("ckNextTime").value,blk=$("ckBlock").value,room=$("ckRoom").value;
  if(choice==="yes"){
    if(!nd||!nt||!blk||!room){msg("nextDetailsRequired","error");return}
    if(nd<todayStr()){msg("nextDatePast","error");return}
  }
  const notes=$("ckNotes").value.trim();
  const body={healthIssue:issue,medicines:meds,notes:notes,nextRequired:choice==="yes"};
  if(choice==="yes"){body.nextDate=nd;body.nextTime=nt;body.block=blk;body.room=room}
  const sig=JSON.stringify([selMobile,body]);
  if(sig===lastSig&&Date.now()-lastSigAt<15000){msg("duplicateSubmit","error");return}
  saving=true;$("saveCheckupBtn").disabled=true;
  try{
    const r=await api("POST","/patients/"+selMobile+"/checkups",body);
    patientsCache[selMobile]=r.patient;
    lastSig=sig;lastSigAt=Date.now();
    resetCheckupForm();
    $("ckIssue").value=issue;ckIssueChanged();
    renderPatientPanel();
    msg("checkupSaved");
  }catch(e){apiFail(e)}
  finally{saving=false;$("saveCheckupBtn").disabled=false}
}

  const p=getPatients()[curPatientMobile];
  if(!p)return;

  let latest;
  if(!v){
    latest='<div class="empty-box">'+esc(t("noCheckup"))+'</div>';
  }else{
    const n=nextInfo(v);
    latest='<div class="dashboard-grid"><div class="detail-box">'+
      '<p><strong>'+esc(t("lastDoctorVisitDate"))+':</strong> '+dash(fmtDate(v.date))+'</p>'+
      '<p><strong>'+esc(t("lastDoctorVisitTime"))+':</strong> '+dash(fmtTime(v.time))+'</p>'+
      '<p><strong>'+esc(t("doctorNameL"))+':</strong> '+dash(v.doctor)+'</p>'+
      '<p><strong>'+esc(t("doctorNotes"))+':</strong> '+dash(v.notes)+'</p></div>'+
      '<div class="detail-box"><p><strong>'+esc(t("latestMedicine"))+':</strong></p>'+medsTable(visitMeds(v))+'</div>'+
      '<div class="detail-box"><p><strong>'+esc(t("nextRequiredL"))+':</strong> '+esc(nextText(v))+'</p>'+
      (n.state==="yes"?'<p><strong>'+esc(t("nextDateTime"))+':</strong> '+dash((fmtDate(v.nextDate)+" "+fmtTime(v.nextTime)).trim())+'</p>'+
      '<p><strong>'+esc(t("blockRoom"))+':</strong> '+dash([v.block?tm(v.block):"",v.room||""].filter(Boolean).join(" / "))+'</p>':'')+'</div></div>';
  }
  $("patientDashboardContent").innerHTML=
    '<div class="hosp-head"><h2>'+esc(hospitalName())+'</h2><div>'+esc(t("currentLogin"))+': '+esc(fmtNow())+'</div></div>'+
    '<div class="detail-box"><h3>'+esc(t("patientInfo"))+'</h3>'+
    '<p><strong>'+esc(t("patientName"))+':</strong> '+esc(p.name||"-")+'</p>'+
    '<p><strong>'+esc(t("mobile"))+':</strong> '+esc(p.mobile)+'</p>'+
    '<p><strong>'+esc(t("age"))+':</strong> '+esc(p.age||"-")+'</p>'+
    '<p><strong>'+esc(t("healthIssue"))+':</strong> '+esc(tm(p.healthIssue||"-"))+'</p>'+
    '<p><strong>'+esc(t("department"))+':</strong> '+esc(tm(p.department||"-"))+'</p></div><br>'+
    '<h2>'+esc(t("latestCheckup"))+'</h2>'+latest+
    ((p.visitHistory||[]).length>1?'<br><h2>'+esc(t("previousVisits"))+'</h2>'+historyHtml(p):'');
}

/* ===================== PRINTABLE RECEIPT ===================== */
function openReceipt(){
  if(userType!=="patient")return;
  const p=getPatients()[curPatientMobile];
  if(!p)return;
  const v=latestVisit(p);
  const row=function(k,val){return'<tr><th>'+esc(k)+'</th><td>'+val+'</td></tr>'};
  let h='<div class="rc-head"><h1>'+esc(t("hospitalTitle"))+' — '+esc(t("city"))+'</h1><h2>'+esc(t("outpatientReceipt"))+'</h2></div>'+
    '<div class="rc-title">'+esc(t("regInfo"))+'</div><table class="rc-table kv">'+
    row(t("patientName"),esc(p.name||"-"))+row(t("mobile"),esc(p.mobile))+row(t("age"),esc(p.age||"-"))+
    row(t("healthIssue"),esc(tm(p.healthIssue||"-")))+row(t("department"),esc(tm(p.department||"-")))+
    (regTimeText(p)?row(t("registeredOn"),esc(regTimeText(p))):"")+'</table>';
  if(!v){
    h+='<p>'+esc(t("noCheckup"))+'</p>';
  }else{
    h+='<div class="rc-title">'+esc(t("checkupInfo"))+'</div><table class="rc-table kv">'+
      (visitDateTime(v)?row(t("date"),esc(visitDateTime(v))):"")+
      (v.doctor?row(t("doctorNameL"),esc(v.doctor)):"")+'</table>';
    const meds=visitMeds(v);
    if(meds.length)h+='<div class="rc-title">'+esc(t("medicines"))+'</div>'+medsTable(meds).replace('class="med-table"','class="rc-table"');
    if(v.notes)h+='<div class="rc-title">'+esc(t("doctorNotes"))+'</div><p>'+esc(v.notes)+'</p>';
    if(nextInfo(v).state==="yes"){
      h+='<div class="rc-title">'+esc(t("appointment"))+'</div><table class="rc-table kv">'+
        row(t("nextVisitDate"),esc(fmtDate(v.nextDate)))+row(t("nextVisitTime"),esc(fmtTime(v.nextTime)))+
        (v.block?row(t("block"),esc(tm(v.block))):"")+(v.room?row(t("room"),esc(v.room)):"")+'</table>';
    }
  }
  h+='<div class="rc-foot">'+esc(t("printedOn"))+': '+esc(fmtNow())+'<br>'+esc(t("receiptFoot"))+'</div>';
  $("receiptSheet").innerHTML=h;
  showPage("receipt");
}
